name: Deploy both editions to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout engineer edition
        uses: actions/checkout@v7
        with:
          ref: main
          path: engineer-source

      - name: Checkout frontend edition
        uses: actions/checkout@v7
        with:
          ref: v1
          path: frontend-source

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            engineer-source/package-lock.json
            frontend-source/package-lock.json

      - name: Install engineer dependencies
        working-directory: engineer-source
        run: npm ci

      - name: Build engineer edition
        working-directory: engineer-source
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend-source
        run: npm ci

      - name: Build frontend edition
        working-directory: frontend-source
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/engineer-edition
          mkdir -p site/frontend-edition
          cp -R engineer-source/dist/. site/engineer-edition/
          cp -R frontend-source/dist/. site/frontend-edition/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
